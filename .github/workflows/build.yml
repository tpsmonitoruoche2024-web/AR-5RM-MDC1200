      - name: Build firmware
        working-directory: ./AR-5RM Firmware/SUBFOLDER
        run: |
          cargo build --release
          cargo objcopy --release -- -O binary firmware.bin

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: AR-5RM-MDC1200REAL
          path: ./AR-5RM Firmware/SUBFOLDER/firmware.bin
